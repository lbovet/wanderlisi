name: Deploy to Dokku
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOKKU_APP: wanderlisi
  APP_ALIAS: wanderlisi.chee.li
  # Persistent storage holding the app's data/ directory (tracks, plans, ...).
  STORAGE_NAME: wanderlisi-data
  # Old application used to seed the storage on the first deploy.
  OLD_DATA_URL: https://www.windmaster.ch/wanderlisi/data

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DOKKU_DEPLOY_KEY }}

      - name: Create app
        run: .github/scripts/dokku.sh apps:create ${{ env.DOKKU_APP }} || true

      - name: Create persistent data storage
        run: .github/scripts/dokku.sh storage:create ${{ env.STORAGE_NAME }} --chown 1000 || true

      - name: Mount data storage
        run: .github/scripts/dokku.sh storage:mount ${{ env.DOKKU_APP }} ${{ env.STORAGE_NAME }} --container-dir /app/data || true

      - name: Initialize data from the old application
        run: .github/scripts/seed_storage.sh

      - name: Set domain alias
        run: .github/scripts/dokku.sh domains:set ${{ env.DOKKU_APP }} ${{ env.APP_ALIAS }}

      - name: Configure port mappings
        run: .github/scripts/dokku.sh ports:set ${{ env.DOKKU_APP }} http:80:3000 https:443:3000

      - name: Connect to cloudbox network
        run: |
          .github/scripts/dokku.sh network:create cloudbox || true
          .github/scripts/dokku.sh network:set ${{ env.DOKKU_APP }} attach-post-deploy cloudbox

      - name: Set build CPU limit
        run: .github/scripts/dokku.sh resource:limit ${{ env.DOKKU_APP }} --process-type build --cpu 0.5

      - name: Deploy to Dokku
        uses: dokku/github-action@v1
        with:
          git_remote_url: ssh://dokku@cloudbox.chee.li:22/${{ env.DOKKU_APP }}
          ssh_private_key: ${{ secrets.DOKKU_DEPLOY_KEY }}

      - name: Enable Let's Encrypt
        run: .github/scripts/dokku.sh letsencrypt:enable ${{ env.DOKKU_APP }}
